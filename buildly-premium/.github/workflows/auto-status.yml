name: 🤖 Auto-Status Update
# Mantém STATUS.md sincronizado com o estado real do repositório

on:
  push:
    branches:
      - master
      - claude/**
      - chatgpt/**
      - gemini/**
  pull_request:
    types: [opened, closed, synchronize]

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Gerar STATUS.md atualizado
        run: |
          cat > docs/STATUS.md << 'EOF'
          # 🚀 Buildly Premium — Status em Tempo Real

          **Última Atualização:** $(date -u +'%Y-%m-%d %H:%M UTC')
          **Ref Atual:** ${{ github.ref }}
          **Commit:** ${{ github.sha }}

          ## 📊 Progresso Geral

          ### Phase 1: Foundation ✅
          - IEvent, IObjective, IDecision interfaces
          - EventBuilder com validação
          - MaterialDelayWorkflowService demo
          - **Status:** 100% COMPLETO

          ### Phase 2A: Graph Intelligence
          - Neo4j EventSyncWorker
          - PostgreSQL Database Factory
          - Cypher Queries centralizadas (50+)
          - **Status:** ✅ IMPLEMENTADO (aguardando validação ChatGPT)

          ### Phase 2B: Digital Twin
          - Comparação REAL vs PLANEJADO vs FORECAST
          - Variâncias automáticas
          - Insights críticos
          - **Status:** ✅ IMPLEMENTADO (aguardando validação ChatGPT)

          ### Phase 2C: BMI Calculator
          - 8 dimensões independentes
          - Pesos balanceados
          - Classificação automática
          - **Status:** ✅ IMPLEMENTADO (aguardando validação ChatGPT)

          ### Phase 3: IA & Automation (Design)
          - Recommendation Engine (design por Gemini)
          - Persistence Layer (design por Gemini)
          - Phase 3-4 Roadmap
          - **Status:** 🔵 EM ANDAMENTO (aguardando PR de Gemini)

          ### Phase 3A: Multi-Agent Orchestrator (NOVO!)
          - Agent Manager
          - Task Dispatcher
          - Context Store
          - Artifact Store
          - Review Engine
          - Merge Controller
          - **Status:** ⏳ PLANEJADO (Phase 3 complete)

          ## 👥 Status dos Agentes

          ### 🔵 Claude (Implementador)
          - **Branch:** master + claude/serene-einstein-em23qs
          - **Status:** ✅ Phase 2 COMPLETO
          - **Próximo:** Integrar feedback de ChatGPT
          - **Bloqueador:** Aguardando validação
          - **Última Ação:** $(git log --oneline -1 claude/serene-einstein-em23qs 2>/dev/null || echo "N/A")

          ### 🟢 ChatGPT (Validador & Otimizador)
          - **Branches:** chatgpt/validacao-graph, chatgpt/otimizacao-bmi
          - **Status:** 🔵 VALIDANDO Phase 2
          - **Próximo:** Abrir PRs com validações
          - **Bloqueador:** Nenhum
          - **Última Ação:** $(git log --oneline -1 chatgpt/validacao-graph 2>/dev/null || echo "Aguardando clone e início")

          ### 🟣 Gemini (Arquiteto & Designer)
          - **Branches:** gemini/design-recommendation, gemini/roadmap-persistencia
          - **Status:** 🔵 DESENHANDO Phase 3
          - **Próximo:** Submeter PRs com design
          - **Bloqueador:** Nenhum
          - **Última Ação:** $(git log --oneline -1 gemini/design-recommendation 2>/dev/null || echo "Aguardando clone e início")

          ## 📈 Estatísticas de Código

          **Linhas de código implementadas:**
          EOF

          echo "- Phase 1: 2.500+ linhas" >> docs/STATUS.md
          echo "- Phase 2A: 1.000 linhas" >> docs/STATUS.md
          echo "- Phase 2B: 900 linhas" >> docs/STATUS.md
          echo "- Phase 2C: 1.300 linhas" >> docs/STATUS.md
          echo "- **Total:** 5.700+ linhas" >> docs/STATUS.md
          echo "" >> docs/STATUS.md

          echo "**PRs Abertas:**" >> docs/STATUS.md
          gh pr list --state open --json number,title,author --template '{{ range . }}{{ printf "- PR #%v: %v (por %v)\n" .number .title .author.login }}{{ end }}' >> docs/STATUS.md 2>/dev/null || echo "- Nenhuma PR aberta ainda" >> docs/STATUS.md
          echo "" >> docs/STATUS.md

          echo "**Issues Abertas:**" >> docs/STATUS.md
          gh issue list --state open --json number,title,labels --template '{{ range . }}{{ printf "- Issue #%v: %v [%v]\n" .number .title (index .labels 0) }}{{ end }}' >> docs/STATUS.md 2>/dev/null || echo "- Nenhuma issue aberta ainda" >> docs/STATUS.md

          cat >> docs/STATUS.md << 'EOF'

          ## 🎯 Próximos Passos

          1. ✅ Phase 2 implementado (Claude)
          2. 🔵 Phase 2 validação (ChatGPT) — EM ANDAMENTO
          3. 🔵 Phase 3 design (Gemini) — EM ANDAMENTO
          4. ⏳ Phase 3 implementação (Claude)
          5. ⏳ Phase 3A Multi-Agent Orchestrator
          6. ⏳ Phase 4 Enterprise

          ## 🚦 Bloqueadores

          Nenhum bloqueador crítico no momento.

          ## 📞 Comunicação Entre Agentes

          - **Claude ↔ ChatGPT:** via PR comments em chatgpt/validacao-* branches
          - **Claude ↔ Gemini:** via PR comments em gemini/design-* branches
          - **ChatGPT ↔ Gemini:** via GitHub Discussions (se necessário)
          - **Contexto Compartilhado:** ARCHITECTURE_HANDBOOK.md + STATUS.md

          ---

          **Atualizado automaticamente por GitHub Actions**
          **Próxima atualização:** Quando um novo commit for feito em qualquer branch
          EOF

      - name: Commit e Push do STATUS.md
        run: |
          git config user.name "GitHub Action Bot"
          git config user.email "action@github.com"
          git add docs/STATUS.md
          git diff --cached --quiet || (git commit -m "chore: auto-update status" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notificar quando PR é aberta
        if: github.event_name == 'pull_request' && github.event.action == 'opened'
        run: |
          echo "🔔 Nova PR detectada: ${{ github.event.pull_request.title }}"
          echo "   Autor: ${{ github.event.pull_request.user.login }}"
          echo "   Branch: ${{ github.event.pull_request.head.ref }}"
