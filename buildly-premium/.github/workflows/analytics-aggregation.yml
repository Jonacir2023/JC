name: Phase 3.7 Analytics Aggregation

on:
  schedule:
    # Run daily at 2 AM UTC (adjust for your timezone)
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  PG_HOST: ${{ secrets.DATABASE_HOST }}
  PG_PORT: ${{ secrets.DATABASE_PORT }}
  PG_DATABASE: ${{ secrets.DATABASE_NAME }}
  PG_USER: ${{ secrets.DATABASE_USER }}
  PG_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}

jobs:
  analytics-aggregation:
    name: Daily Analytics Aggregation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('apps/analytics-aggregator/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: Run daily aggregation
        run: |
          cd buildly-premium
          python apps/analytics-aggregator/aggregation_service.py --mode daily

      - name: Health check
        if: always()
        run: |
          cd buildly-premium
          python apps/analytics-aggregator/aggregation_service.py --mode health

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v6
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ Analytics aggregation job failed. Check workflow logs.'
            })

  hourly-cache-refresh:
    name: Hourly Cache Refresh
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install psycopg2-binary python-dotenv

      - name: Run hourly refresh
        run: |
          cd buildly-premium
          python apps/analytics-aggregator/aggregation_service.py --mode hourly

  looker-studio-sync:
    name: Looker Studio Data Sync
    runs-on: ubuntu-latest
    needs: analytics-aggregation
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Trigger Looker Studio refresh
        env:
          LOOKER_API_KEY: ${{ secrets.LOOKER_API_KEY }}
        run: |
          # Optional: Use Looker API to refresh data connector
          # See: https://cloud.google.com/looker/docs/r/api/latest/methods/query_apis/create
          echo "Looker Studio connectors configured to refresh automatically"

      - name: Verify data availability
        run: |
          echo "✅ Analytics data pipeline ready for Looker Studio"
