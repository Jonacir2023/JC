version: '3.8'

services:
  # PostgreSQL - Event Store + State
  postgres:
    image: postgres:15-alpine
    container_name: buildly-postgres
    environment:
      POSTGRES_DB: buildly_db
      POSTGRES_USER: buildly_user
      POSTGRES_PASSWORD: buildly_secure_password_2026
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./buildly-premium/modules/brain/supabase/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U buildly_user -d buildly_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildly-network

  # Redis - Cache Layer
  redis:
    image: redis:7-alpine
    container_name: buildly-redis
    command: redis-server --appendonly yes --requirepass buildly_redis_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildly-network

  # Brain ML Engine
  brain-ml:
    build:
      context: ./buildly-premium/modules/brain/apps/ml-engine
      dockerfile: Dockerfile
    container_name: buildly-brain-ml
    environment:
      NODE_ENV: development
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: buildly_db
      PG_USER: buildly_user
      PG_PASSWORD: buildly_secure_password_2026
      REDIS_URL: redis://:buildly_redis_2026@redis:6379/0
      PORT: 3002
      LOG_LEVEL: debug
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/ml/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - buildly-network
    volumes:
      - ./buildly-premium/modules/brain/apps/ml-engine/src:/app/src

  # Core API
  core-api:
    build:
      context: ./buildly-premium/apps/core-api
      dockerfile: Dockerfile
    container_name: buildly-core-api
    environment:
      NODE_ENV: development
      PORT: 3001
      BRAIN_ML_URL: http://brain-ml:3002
      BRAIN_API_TOKEN: ${BRAIN_API_TOKEN:-}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: buildly_db
      PG_USER: buildly_user
      PG_PASSWORD: buildly_secure_password_2026
      REDIS_URL: redis://:buildly_redis_2026@redis:6379/1
      LOG_LEVEL: debug
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      brain-ml:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - buildly-network
    volumes:
      - ./buildly-premium/apps/core-api/src:/app/src

  # PgAdmin - Database Management (optional)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: buildly-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@buildly.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - buildly-network

  # Redis Commander - Redis Management (optional)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: buildly-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:buildly_redis_2026
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - buildly-network

networks:
  buildly-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
