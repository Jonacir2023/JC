version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: buildly-postgres
    environment:
      POSTGRES_DB: buildly
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: buildly_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildly-network

  # Neo4j Graph Database (optional)
  neo4j:
    image: neo4j:5.12-community
    container_name: buildly-neo4j
    environment:
      NEO4J_AUTH: neo4j/buildly_dev_password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/var/lib/neo4j/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildly-network

  # Intelligence Layer API
  intelligence-layer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.intelligence-layer
    container_name: buildly-intelligence-layer
    environment:
      NODE_ENV: development
      API_PORT: 3001
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: buildly
      PG_USER: postgres
      PG_PASSWORD: buildly_dev_password
      PG_POOL_MIN: 5
      PG_POOL_MAX: 20
      NEO4J_HOST: neo4j
      NEO4J_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: buildly_dev_password
      MODEL_PATH: /app/data/models
      MODEL_CACHE_TTL: 60000
      INFERENCE_LATENCY_THRESHOLD_MS: 200
      LOG_LEVEL: info
      CORS_ORIGIN: "*"
    ports:
      - "3001:3001"
    volumes:
      - ../data/models:/app/data/models
      - ../logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/recommendations/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildly-network

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: buildly-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - buildly-network

  # Grafana Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: buildly-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: 'grafana-piechart-panel'
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - buildly-network

volumes:
  postgres_data:
  neo4j_data:
  prometheus_data:
  grafana_data:

networks:
  buildly-network:
    driver: bridge
