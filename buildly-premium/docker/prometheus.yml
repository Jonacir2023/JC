global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'buildly-monitoring'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - 'alert_rules.yml'

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Intelligence Layer API metrics
  - job_name: 'intelligence-layer'
    static_configs:
      - targets: ['intelligence-layer:3001']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

  # PostgreSQL (via node exporter if available)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
    # Requires postgres_exporter running as separate container
    # For now, metrics are collected via PostgreSQL monitoring views

  # Neo4j metrics
  - job_name: 'neo4j'
    static_configs:
      - targets: ['neo4j:7474']
    metrics_path: '/db/data/metrics'
