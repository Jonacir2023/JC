[pytest]
# Pytest configuration for Buildly Brain tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (medium speed, with mocks)
    slow: Slow tests (performance benchmarks, load tests)
    smoke: Smoke tests (quick validation)

# Output and reporting
addopts =
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Coverage configuration (for future use)
# addopts = --cov=scripts --cov-report=html --cov-report=term-missing

# Timeout for tests (prevent hanging)
timeout = 300

# Test paths
testpaths = tests

# Minimum Python version
minversion = 3.9

# Asyncio configuration (for async tests)
asyncio_mode = auto

# Log configuration
log_cli = false
log_cli_level = INFO
log_file = tests/pytest.log
log_file_level = DEBUG

# doctest configuration
doctest_optionflags = NORMALIZE_WHITESPACE ELLIPSIS
