<script>
(()=>{
'use strict';

const STORAGE_KEY='buildly-premium-v2::demo-state::2.2';
const clone=x=>JSON.parse(JSON.stringify(x));
const BASE_DATA=clone(window.BUILDLY_DATA);
try{
  const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
  if(saved&&saved.version==='2.2'&&saved.data) window.BUILDLY_DATA=saved.data;
}catch(e){}
const D=window.BUILDLY_DATA;
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const h=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const num=v=>Number(v||0);
const sum=(arr,fn=x=>x)=>arr.reduce((a,x)=>a+num(fn(x)),0);
const avg=arr=>arr.length?sum(arr)/arr.length:0;
const money=v=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(num(v));
const moneyM=v=>'R$ '+(num(v)/1e6).toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+' mi';
const dateBR=s=>s?new Date(s+'T12:00:00').toLocaleDateString('pt-BR'):'—';
const pct=v=>num(v).toLocaleString('pt-BR',{maximumFractionDigits:1})+'%';
function todayISO(){const p=new Intl.DateTimeFormat('en-US',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const m=Object.fromEntries(p.map(x=>[x.type,x.value]));return `${m.year}-${m.month}-${m.day}`}
function uid(prefix){return `${prefix}-${Date.now().toString(36).toUpperCase()}`}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({version:'2.2',savedAt:new Date().toISOString(),data:D}))}catch(e){}}
function resetDemo(){try{localStorage.removeItem(STORAGE_KEY)}catch(e){} location.reload()}
function exportDemo(){downloadBlob('buildly-premium-v2-rc1.json',JSON.stringify({version:'2.2',exportedAt:new Date().toISOString(),data:D},null,2),'application/json')}
function importDemo(file){const r=new FileReader();r.onload=()=>{try{const p=JSON.parse(r.result);if(!p?.data||!p.data.works||!p.data.profiles)throw new Error('Estrutura inválida');Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,clone(p.data));persist();state.work=D.works[0];state.profile=D.profiles[0];state.page='dashboard';state.context=null;toast('Dados importados.');renderAll()}catch(e){toast('Arquivo inválido para o BUILDLy.')}};r.readAsText(file)}
function downloadBlob(name,text,type='text/plain'){const blob=new Blob([text],{type});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function csvEscape(v){const s=String(v??'');return /[;"\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s}
function downloadCsv(name,rows){downloadBlob(name,rows.map(r=>r.map(csvEscape).join(';')).join('\n'),'text/csv;charset=utf-8')}

const state={work:D.works[0],profile:D.profiles[0],page:'dashboard',context:null,openGroups:new Set(['planejamento','eap','financeiro']),query:'',planningTab:'cronograma',cadastroTab:'atividades',wbsTab:'visao',procurementTab:'requisicoes',rdoTab:'diario',rdoSummaryMode:'mes',rdoCalendarAnchor:todayISO().slice(0,7)};
function audit(module,action,reference,detail=''){D.auditTrail=D.auditTrail||[];D.auditTrail.unshift({id:uid('AUD'),date:new Date().toISOString(),module,action,reference,user:state.profile.label,detail});}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hidden'),2400)}
function actionsFor(module){
  if(state.profile.global)return ['view','create','edit','delete','approve','generate'];
  const base=[...(D.permissions[state.profile.role]?.[module]||[])];
  if(state.profile.specialties?.includes('medicoes_custos')){
    if(['custos','nfs'].includes(module))base.push('view','create','edit');
    if(['orcamento','contratos','medicoes'].includes(module))base.push('view');
  }
  if(state.profile.specialties?.includes('planejamento')&&module==='planejamento')base.push('view','create','edit');
  return [...new Set(base)];
}
function can(module,action='view'){return state.profile.global||actionsFor(module).includes(action)}
function requirePerm(module,action='view'){if(can(module,action))return true;toast('Seu perfil não possui permissão para esta operação.');return false}

function statusPill(s){const x=String(s||'').toLowerCase();const cls=/crit|atras|reje|cancel|vencid/.test(x)?'bad':/aten|rascun|confer|program|aberta|andamento|aprova[cç][aã]o/.test(x)?'warn':/aprov|ativo|paga|pago|realizada|concl|afc|normal/.test(x)?'ok':'neutral';return `<span class="pill ${cls}">${h(s||'—')}</span>`}
function btn(label,id,primary=false,disabled=false,extra=''){return `<button class="btn${primary?' primary':''}" id="${h(id)}" ${disabled?'disabled':''} ${extra}>${h(label)}</button>`}
function iconBtn(label,action,title=''){return `<button class="mini-btn" data-action="${h(action)}" title="${h(title||label)}">${h(label)}</button>`}
function pageHead(title,subtitle,actions=''){return `<div class="page-head"><div><h1>${h(title)}</h1><p>${h(subtitle)}</p></div><div class="actions">${actions}</div></div>`}
function empty(text='Nenhum registro.'){return `<div class="empty">${h(text)}</div>`}
function option(value,label,selected=false){return `<option value="${h(value)}" ${selected?'selected':''}>${h(label)}</option>`}
function field(label,control,full=false){return `<div class="field${full?' full':''}"><label>${h(label)}</label>${control}</div>`}
function input(id,value='',type='text',attrs=''){return `<input id="${h(id)}" type="${h(type)}" value="${h(value)}" ${attrs}>`}
function select(id,items,value=''){return `<select id="${h(id)}">${items.map(x=>option(x.value,x.label,x.value===value)).join('')}</select>`}
function textarea(id,value=''){return `<textarea id="${h(id)}">${h(value)}</textarea>`}
function tabs(items,active,prefix){return `<div class="tabs">${items.map(x=>`<button class="tab ${x.id===active?'active':''}" data-tab-group="${h(prefix)}" data-tab="${h(x.id)}">${h(x.label)}</button>`).join('')}</div>`}

function wbsName(id){const w=D.wbs.find(x=>x.id===id);return w?`${w.code} ${w.name}`:id||'—'}
function cbsName(code){const c=D.cbs.find(x=>x.code===code);return c?`${c.code} ${c.name}`:code||'—'}
function contractBase(c){return sum(c.items,i=>i.amount)}
function approvedAmendments(contractId){return D.contractAmendments.filter(a=>a.contract===contractId&&a.status==='aprovado')}
function contractValue(c){return contractBase(c)+sum(approvedAmendments(c.id),a=>a.amount)}
function contractApproved(c){return ['aprovado','ativo','encerrado'].includes(c.status)}
function measuredContract(id){return sum(D.measurements.filter(m=>m.contract===id&&m.status==='aprovada'),m=>m.amount)}
function invoicePaidAmount(id){return sum(D.payments.filter(p=>p.invoice===id&&p.status==='pago'),p=>p.amount)}
function poApproved(p){return ['aprovado','emitido','parcialmente_recebido','recebido','encerrado'].includes(p.status)}
function poReceivedAmount(id){return sum((D.receipts||[]).filter(r=>r.order===id&&r.status!=='cancelado'),r=>r.amount)}
function poBalance(p){return Math.max(0,num(p?.amount)-poReceivedAmount(p?.id))}
function poRealized(id){return sum(D.invoices.filter(n=>n.source===id&&['aprovada','paga'].includes(n.status)),n=>n.amount)}
function financial(){
  const original=sum(D.budgetLines,b=>b.original);
  const adj=sum(D.budgetAdjustments.filter(a=>a.status==='aprovada'),a=>a.delta);
  const current=original+adj;
  const contractCommitments=sum(D.contracts.filter(contractApproved),contractValue);
  const poCommitments=sum((D.purchaseOrders||[]).filter(poApproved),p=>p.amount);
  const commitments=contractCommitments+poCommitments;
  const realizedContract=sum(D.measurements.filter(m=>m.status==='aprovada'),m=>m.amount);
  const realizedPurchase=sum(D.invoices.filter(n=>(D.purchaseOrders||[]).some(p=>p.id===n.source)&&['aprovada','paga'].includes(n.status)),n=>n.amount);
  const direct=sum(D.directCosts.filter(c=>c.status==='aprovado'),c=>c.amount);
  const remainingContracts=Math.max(0,contractCommitments-realizedContract);
  const remainingPurchases=Math.max(0,poCommitments-realizedPurchase);
  const remaining=remainingContracts+remainingPurchases;
  const assigned=remaining+realizedContract+realizedPurchase+direct;
  const available=current-assigned;
  const paid=sum(D.payments.filter(p=>p.status==='pago'),p=>p.amount);
  const forecast=assigned+sum(D.forecastExtras,f=>f.amount);
  return{original,adj,current,commitments,contractCommitments,poCommitments,realizedContract,realizedPurchase,direct,realized:realizedContract+realizedPurchase+direct,remaining,assigned,available,paid,forecast,projected:current-forecast};
}
function wbsIds(id){const out=[id];for(let i=0;i<out.length;i++)D.wbs.filter(w=>w.parent===out[i]).forEach(w=>{if(!out.includes(w.id))out.push(w.id)});return out}
function measurementShare(m,wbsIdsSet,cbs=null){const c=D.contracts.find(x=>x.id===m.contract);if(!c)return 0;const total=contractBase(c);if(!total)return 0;const scoped=sum(c.items.filter(i=>wbsIdsSet.includes(i.wbs)&&(!cbs||i.cbs===cbs)),i=>i.amount);return num(m.amount)*(scoped/total)}
function financialByWbs(id){
  const ids=wbsIds(id);
  const original=sum(D.budgetLines.filter(b=>ids.includes(b.wbs)),b=>b.original);
  const adj=sum(D.budgetAdjustments.filter(a=>a.status==='aprovada'&&ids.includes(a.wbs)),a=>a.delta);
  const current=original+adj;
  const contracts=D.contracts.filter(contractApproved);
  const contractCommitments=sum(contracts,c=>sum(c.items.filter(i=>ids.includes(i.wbs)),i=>i.amount)+sum(approvedAmendments(c.id),a=>{const share=contractBase(c)?sum(c.items.filter(i=>ids.includes(i.wbs)),i=>i.amount)/contractBase(c):0;return a.amount*share}));
  const poCommitments=sum((D.purchaseOrders||[]).filter(p=>poApproved(p)&&ids.includes(p.wbs)),p=>p.amount);
  const commitments=contractCommitments+poCommitments;
  const measured=sum(D.measurements.filter(m=>m.status==='aprovada'),m=>measurementShare(m,ids));
  const purchaseRealized=sum(D.invoices.filter(n=>['aprovada','paga'].includes(n.status)&&(D.purchaseOrders||[]).some(p=>p.id===n.source&&ids.includes(p.wbs))),n=>n.amount);
  const direct=sum(D.directCosts.filter(c=>c.status==='aprovado'&&ids.includes(c.wbs)),c=>c.amount);
  const remaining=Math.max(0,contractCommitments-measured)+Math.max(0,poCommitments-purchaseRealized);
  const assigned=remaining+measured+purchaseRealized+direct;
  const forecast=assigned+sum(D.forecastExtras.filter(f=>ids.includes(f.wbs)),f=>f.amount);
  return{original,current,commitments,measured,purchaseRealized,direct,remaining,assigned,available:current-assigned,forecast,projected:current-forecast};
}
function budgetRows(){
  return D.budgetLines.map(b=>{
    const adj=sum(D.budgetAdjustments.filter(a=>a.status==='aprovada'&&a.wbs===b.wbs&&a.cbs===b.cbs),a=>a.delta);
    const current=b.original+adj;
    const contracts=D.contracts.filter(contractApproved);
    const commitment=sum(contracts,c=>{
      const base=contractBase(c);const scoped=sum(c.items.filter(i=>i.wbs===b.wbs&&i.cbs===b.cbs),i=>i.amount);const ad=base?sum(approvedAmendments(c.id),a=>a.amount)*(scoped/base):0;return scoped+ad;
    });
    const poCommitment=sum((D.purchaseOrders||[]).filter(p=>poApproved(p)&&p.wbs===b.wbs&&p.cbs===b.cbs),p=>p.amount);
    const totalCommitment=commitment+poCommitment;
    const measured=sum(D.measurements.filter(m=>m.status==='aprovada'),m=>measurementShare(m,[b.wbs],b.cbs));
    const purchaseRealized=sum(D.invoices.filter(n=>['aprovada','paga'].includes(n.status)&&(D.purchaseOrders||[]).some(p=>p.id===n.source&&p.wbs===b.wbs&&p.cbs===b.cbs)),n=>n.amount);
    const direct=sum(D.directCosts.filter(c=>c.status==='aprovado'&&c.wbs===b.wbs&&c.cbs===b.cbs),c=>c.amount);
    const assigned=Math.max(0,commitment-measured)+Math.max(0,poCommitment-purchaseRealized)+measured+purchaseRealized+direct;
    return{...b,adj,current,commitment:totalCommitment,realized:measured+purchaseRealized+direct,available:current-assigned};
  });
}
function ppc(){const planned=sum(D.weeklyPlan,x=>x.plannedQty);const actual=sum(D.weeklyPlan,x=>Math.min(num(x.actualQty),num(x.plannedQty)));return planned?actual/planned*100:0}

function renderSelectors(){
  $('#obraSelect').innerHTML=D.works.map(w=>option(w.id,`${w.code} · ${w.name}`,w.id===state.work.id)).join('');
  $('#roleSelect').innerHTML=D.profiles.map(p=>option(p.id,p.label,p.id===state.profile.id)).join('');
  $('#profileChip').textContent=state.profile.label;
  $('#modeBadge').textContent='RC1 · DEMO LOCAL';
}
function moduleLabel(p){return({dashboard:'Dashboard Executivo',planejamento:'Planejamento',orcamento:'Orçamento',custos:'Custos',contratos:'Contratos',medicoes:'Medições',nfs:'Notas Fiscais',rdo:'RDO',cadastro:'Cadastro',equipamentos:'Equipamentos',efetivo:'Efetivo',alertas:'Alertas',ocorrencias:'Ocorrências',tarefas:'Tarefas',reunioes:'Reuniões',relatorios:'Relatórios',documentos:'Documentos',eap:'EAP',suprimentos:'Suprimentos',brain:'Brain',auditoria:'Auditoria'})[p]||p}
function treeLeaf(page,icon,label,module,meta='',depth=1,ctx=null,sub=null){if(!can(module,'view'))return'';const active=state.page===page&&(!ctx||state.context===ctx)&&(!sub||state.planningTab===sub);return `<button class="tree-row depth-${depth}${active?' active':''}" data-page="${h(page)}" ${ctx?`data-context="${h(ctx)}"`:''} ${sub?`data-sub="${h(sub)}"`:''}><span class="tree-icon">${h(icon)}</span><span class="tree-label">${h(label)}</span>${meta?`<span class="tree-meta">${h(meta)}</span>`:''}</button>`}
function group(id,icon,label,meta,children){const open=state.openGroups.has(id);return `<div class="tree-group${open?'':' collapsed'}"><button class="tree-row tree-parent" data-group="${h(id)}"><span class="chev">${open?'▼':'▶'}</span><span class="tree-icon">${h(icon)}</span><span class="tree-label">${h(label)}</span>${meta?`<span class="tree-meta">${h(meta)}</span>`:''}</button><div class="tree-children">${children}</div></div>`}
function renderTree(){
  const f=financial();let html=treeLeaf('dashboard','▦','Dashboard','dashboard');
  if(can('planejamento','view'))html+=group('planejamento','▤','Planejamento',`${Math.round(avg(D.planning.map(p=>p.actual)))}%`,[
    treeLeaf('planejamento','·','Cronograma / Avanço','planejamento','',2,null,'cronograma'),
    treeLeaf('planejamento','·','Programação semanal','planejamento',`PPC ${Math.round(ppc())}%`,2,null,'semanal'),
    treeLeaf('planejamento','·','Programação quinzenal','planejamento','',2,null,'quinzenal'),
    treeLeaf('planejamento','·','Restrições','planejamento',String(D.restrictions.filter(r=>r.status!=='concluida').length),2,null,'restricoes'),
    treeLeaf('planejamento','·','Curva S','planejamento','',2,null,'curvas')
  ].join(''));
  if(can('orcamento','view')){
    const roots=D.wbs.filter(w=>!w.parent);
    const kids=roots.map(w=>group('wbs-'+w.id,'≡',`${w.code} ${w.name}`,`${w.progress}%`,D.wbs.filter(x=>x.parent===w.id).map(c=>treeLeaf('wbs','·',`${c.code} ${c.name}`,'orcamento',`${c.progress}%`,3,c.id)).join(''))).join('');
    html+=group('eap','≡','EAP da Obra','',treeLeaf('eap','·','Gerenciar EAP','orcamento',String(D.wbs.length),2)+kids);
  }
  if(can('orcamento','view')||can('custos','view'))html+=group('financeiro','$','Financeiro',moneyM(f.current),treeLeaf('orcamento','·','Orçamento Atual','orcamento',moneyM(f.current),2)+treeLeaf('custos','·','Custos / Forecast','custos',moneyM(f.forecast),2));
  html+=treeLeaf('contratos','▣','Contratos','contratos',String(D.contracts.length))+treeLeaf('suprimentos','▰','Suprimentos','suprimentos',String((D.purchaseRequests||[]).length))+treeLeaf('medicoes','▥','Medições','medicoes',String(D.measurements.length))+treeLeaf('nfs','▧','Notas Fiscais','nfs',String(D.invoices.length))+treeLeaf('rdo','▨','RDO','rdo',String(D.rdos.length))+treeLeaf('cadastro','◉','Cadastro','cadastro')+treeLeaf('equipamentos','◆','Equipamentos','equipamentos',String(D.equipment.length))+treeLeaf('efetivo','●','Efetivo','efetivo')+treeLeaf('alertas','!','Alertas','alertas',String(D.alerts.filter(a=>!a.read).length))+treeLeaf('ocorrencias','▲','Ocorrências','ocorrencias',String(D.occurrences.length))+treeLeaf('tarefas','✓','Tarefas','tarefas',String(D.tasks.filter(t=>t.status!=='concluida').length))+treeLeaf('reunioes','◫','Reuniões','reunioes',String(D.meetings.length))+treeLeaf('relatorios','▤','Relatórios','relatorios')+treeLeaf('documentos','▱','Documentos','documentos',String(D.documents.length))+treeLeaf('brain','✦','Brain','brain')+treeLeaf('auditoria','◎','Auditoria','auditoria',String((D.auditTrail||[]).length));
  $('#tree').innerHTML=html;applyTreeFilter();bindTree();
}
function applyTreeFilter(){const q=state.query.toLowerCase().trim();if(!q)return;$$('#tree .tree-row').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'flex':'none');$$('#tree .tree-group').forEach(g=>g.classList.remove('collapsed'))}
function bindTree(){$$('.tree-parent').forEach(b=>b.onclick=()=>{const id=b.dataset.group;state.openGroups.has(id)?state.openGroups.delete(id):state.openGroups.add(id);renderTree()});$$('.tree-row[data-page]').forEach(b=>b.onclick=()=>{if(b.dataset.sub)state.planningTab=b.dataset.sub;navigate(b.dataset.page,b.dataset.context||null)})}
function navigate(page,context=null){const module=['wbs','eap'].includes(page)?'orcamento':page;if(page!=='dashboard'&&!can(module,'view'))return toast('Módulo bloqueado para este perfil.');state.page=page;state.context=context;renderAll();if(innerWidth<820)$('#sidebar').classList.remove('show')}
function breadcrumb(){const p=state.page==='wbs'?wbsName(state.context):moduleLabel(state.page);$('#breadcrumb').innerHTML=`${h(state.work.name)} &gt; <b>${h(p)}</b>`}
function renderAll(){persist();renderSelectors();renderTree();breadcrumb();renderPage()}
function renderPage(){
  const c=$('#content');const f=financial();
  const pages={dashboard:()=>dashboardPage(f),planejamento:planningPage,orcamento:budgetPage,custos:()=>costsPage(f),contratos:contractsPage,medicoes:measurementsPage,nfs:invoicesPage,rdo:rdoPage,cadastro:cadastroPage,equipamentos:equipmentPage,efetivo:workforcePage,alertas:alertsPage,ocorrencias:occurrencesPage,tarefas:tasksPage,reunioes:meetingsPage,relatorios:()=>reportsPage(f),documentos:documentsPage,wbs:()=>wbsPage(state.context),eap:eapPage,suprimentos:suppliesPage,brain:brainPage,auditoria:auditPage};
  c.innerHTML=(pages[state.page]||(()=>empty('Módulo indisponível.')))();bindPage();
}

function dashboardPage(f){const physical=avg(D.curveS.filter(x=>x.actual!==null).slice(-1).map(x=>x.actual))||61.8;const planned=D.curveS.filter(x=>x.actual!==null).slice(-1)[0]?.planned||64.5;return pageHead('Dashboard Executivo','Prazo, custos, contratos e produção em uma única visão.')+`<div class="kpi-grid">
  <div class="card kpi"><div class="kpi-label">AVANÇO FÍSICO</div><div class="kpi-value">${pct(physical)}</div><div class="kpi-sub">Planejado ${pct(planned)} · desvio ${(physical-planned).toFixed(1)} p.p.</div><div class="progress"><span style="width:${Math.min(100,physical)}%"></span></div></div>
  <div class="card kpi"><div class="kpi-label">ORÇAMENTO ATUAL</div><div class="kpi-value">${moneyM(f.current)}</div><div class="kpi-sub">Original ${moneyM(f.original)} · alterações ${moneyM(f.adj)}</div></div>
  <div class="card kpi"><div class="kpi-label">COMPROMETIDO</div><div class="kpi-value">${moneyM(f.commitments)}</div><div class="kpi-sub">${pct(f.current?f.commitments/f.current*100:0)} do orçamento</div><div class="progress"><span style="width:${Math.min(100,f.current?f.commitments/f.current*100:0)}%"></span></div></div>
  <div class="card kpi"><div class="kpi-label">SALDO DISPONÍVEL</div><div class="kpi-value ${f.available<0?'metric-negative':''}">${moneyM(f.available)}</div><div class="kpi-sub">Orçamento - valor apropriado</div></div></div>
  <div class="grid-2"><div class="card section"><h2>Contratos críticos</h2><div class="table-wrap"><table><thead><tr><th>Contrato</th><th>Atual</th><th>Medido</th><th>Saldo</th><th>Status</th></tr></thead><tbody>${D.contracts.filter(contractApproved).map(c=>{const v=contractValue(c),m=measuredContract(c.id),saldo=v-m;return `<tr class="clickable-row" data-contract="${h(c.id)}"><td><b>${h(c.number)}</b><br><span class="muted">${h(c.name)}</span></td><td>${moneyM(v)}</td><td>${moneyM(m)}</td><td>${moneyM(saldo)}</td><td>${statusPill(v&&saldo/v<.2?'Atenção':'Normal')}</td></tr>`}).join('')}</tbody></table></div></div>
  <div class="card section"><h2>Posição financeira</h2><div class="financial-list">${[['Orçamento atual',f.current],['Comprometido',f.commitments],['Comprometido restante',f.remaining],['Realizado',f.realized],['Pago',f.paid],['Forecast final',f.forecast],['Saldo projetado',f.projected]].map(([l,v])=>`<div class="financial-row"><span>${h(l)}</span><b class="${v<0?'metric-negative':''}">${moneyM(v)}</b></div>`).join('')}</div></div></div>
  <div class="grid-2"><div class="card section"><h2>Planejamento crítico</h2>${D.planning.filter(p=>p.critical).map(p=>barLine(p.activity,p.actual,p.planned)).join('')}</div><div class="card section"><h2>Alertas de gestão</h2>${D.alerts.filter(a=>!a.read).map(a=>`<div class="financial-row"><span>${h(a.title)}<br><small>${h(a.detail)}</small></span>${statusPill(a.severity)}</div>`).join('')||empty('Sem alertas não lidos.')}</div></div>`}
function barLine(label,actual,planned){const cls=actual+3<planned?'bad':actual<planned?'warn':'';return `<div class="bar-row"><span>${h(label)}</span><div class="bar-bg"><div class="bar-fill ${cls}" style="width:${Math.min(100,num(actual))}%"></div></div><b>${h(actual)}%</b></div>`}

function wbsPage(id){const w=D.wbs.find(x=>x.id===id);if(!w)return empty('EAP não encontrada.');const f=financialByWbs(id);const ids=wbsIds(id);const relatedContracts=D.contracts.filter(c=>c.items.some(i=>ids.includes(i.wbs)));const plan=D.planning.filter(p=>ids.includes(p.wbs));const rdos=D.rdos.slice(-5);const docs=D.documents.filter(d=>d.discipline==='Civil'||d.discipline==='Estrutural'||d.discipline==='Planejamento');const tb=tabs([{id:'visao',label:'Visão Geral'},{id:'orcamento',label:'Orçamento'},{id:'contratos',label:'Contratos'},{id:'planejamento',label:'Planejamento'},{id:'rdo',label:'RDOs'},{id:'documentos',label:'Documentos'}],state.wbsTab,'wbs');let body='';
  if(state.wbsTab==='visao')body=`<div class="grid-2"><div class="card section"><h2>Project Controls</h2>${plan.length?plan.map(p=>barLine(p.activity,p.actual,p.planned)).join(''):empty('Sem atividade detalhada.')}</div><div class="card section"><h2>Contexto financeiro</h2>${financialList([['Orçamento',f.current],['Compromissos',f.commitments],['Realizado contratado',f.measured],['Custos diretos',f.direct],['Forecast',f.forecast],['Saldo projetado',f.projected]])}</div></div>`;
  if(state.wbsTab==='orcamento')body=`<div class="card section">${budgetTable(budgetRows().filter(b=>ids.includes(b.wbs)))}</div>`;
  if(state.wbsTab==='contratos')body=`<div class="card section">${contractsTable(relatedContracts)}</div>`;
  if(state.wbsTab==='planejamento')body=`<div class="card section">${plan.length?plan.map(p=>barLine(p.activity,p.actual,p.planned)).join(''):empty()}</div>`;
  if(state.wbsTab==='rdo')body=`<div class="card section">${rdoTable(rdos)}</div>`;
  if(state.wbsTab==='documentos')body=`<div class="card section">${documentsTable(docs)}</div>`;
  return pageHead(`${w.code} ${w.name}`,'Visão integrada da EAP selecionada.')+`<div class="tree-context"><div class="context-chip"><small>AVANÇO</small><b>${pct(w.progress)}</b></div><div class="context-chip"><small>ORÇAMENTO ATUAL</small><b>${moneyM(f.current)}</b></div><div class="context-chip"><small>COMPROMETIDO</small><b>${moneyM(f.commitments)}</b></div><div class="context-chip"><small>SALDO DISPONÍVEL</small><b>${moneyM(f.available)}</b></div></div>${tb}${body}`;
}
function financialList(rows){return `<div class="financial-list">${rows.map(([l,v])=>`<div class="financial-row"><span>${h(l)}</span><b class="${num(v)<0?'metric-negative':''}">${moneyM(v)}</b></div>`).join('')}</div>`}

function budgetTable(rows){return `<div class="table-wrap"><table><thead><tr><th>EAP</th><th>CBS</th><th>Original</th><th>Alterações</th><th>Atual</th><th>Comprometido</th><th>Realizado</th><th>Disponível</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${h(wbsName(r.wbs))}</td><td>${h(cbsName(r.cbs))}</td><td>${moneyM(r.original)}</td><td>${moneyM(r.adj)}</td><td><b>${moneyM(r.current)}</b></td><td>${moneyM(r.commitment)}</td><td>${moneyM(r.realized)}</td><td class="${r.available<0?'metric-negative':''}">${moneyM(r.available)}</td></tr>`).join('')}</tbody></table></div>`}
function budgetPage(){const f=financial();const actions=can('orcamento','create')?btn('Nova alteração','newBudgetAdj',true):'';const pending=D.budgetAdjustments.filter(a=>a.status!=='aprovada');return pageHead('Orçamento','Baseline, alterações, comprometimento e saldo por EAP × CBS.',actions)+`<div class="kpi-grid"><div class="card kpi"><div class="kpi-label">ORIGINAL</div><div class="kpi-value">${moneyM(f.original)}</div></div><div class="card kpi"><div class="kpi-label">ALTERAÇÕES APROVADAS</div><div class="kpi-value">${moneyM(f.adj)}</div></div><div class="card kpi"><div class="kpi-label">ATUAL</div><div class="kpi-value">${moneyM(f.current)}</div></div><div class="card kpi"><div class="kpi-label">DISPONÍVEL</div><div class="kpi-value ${f.available<0?'metric-negative':''}">${moneyM(f.available)}</div></div></div><div class="card section"><h2>Posição por EAP × CBS</h2>${budgetTable(budgetRows())}</div><div class="card section gap-top"><h2>Alterações orçamentárias</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>Tipo</th><th>EAP</th><th>CBS</th><th>Descrição</th><th>Delta</th><th>Status</th><th></th></tr></thead><tbody>${D.budgetAdjustments.map(a=>`<tr><td>${h(a.id)}</td><td>${h(a.type||'revisao')}</td><td>${h(wbsName(a.wbs))}</td><td>${h(cbsName(a.cbs))}</td><td>${h(a.description)}</td><td>${money(a.delta)}</td><td>${statusPill(a.status)}</td><td>${a.status==='em_aprovacao'&&can('orcamento','approve')?iconBtn('Aprovar',`approve-budget:${a.id}`):''}</td></tr>`).join('')}</tbody></table></div>${pending.length?'<div class="info-box">Alterações pendentes não afetam o Orçamento Atual.</div>':''}</div>`}

function costsPage(f){const actions=can('custos','create')?btn('Novo custo','newCost',true):'';return pageHead('Custos e Forecast','Custos diretos, pagamentos, projeções e posição consolidada.',actions)+`<div class="kpi-grid"><div class="card kpi"><div class="kpi-label">REALIZADO TOTAL</div><div class="kpi-value">${moneyM(f.realized)}</div></div><div class="card kpi"><div class="kpi-label">PAGO</div><div class="kpi-value">${moneyM(f.paid)}</div></div><div class="card kpi"><div class="kpi-label">FORECAST</div><div class="kpi-value">${moneyM(f.forecast)}</div></div><div class="card kpi"><div class="kpi-label">SALDO PROJETADO</div><div class="kpi-value ${f.projected<0?'metric-negative':'metric-positive'}">${moneyM(f.projected)}</div></div></div><div class="grid-2"><div class="card section"><h2>Custos diretos</h2><div class="table-wrap"><table><thead><tr><th>Data</th><th>EAP</th><th>CBS</th><th>Categoria</th><th>Descrição</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${D.directCosts.map(c=>`<tr><td>${dateBR(c.date)}</td><td>${h(wbsName(c.wbs))}</td><td>${h(c.cbs)}</td><td>${h(c.category)}</td><td>${h(c.description)}</td><td>${money(c.amount)}</td><td>${statusPill(c.status)}</td><td>${c.status!=='aprovado'&&can('custos','approve')?iconBtn('Aprovar',`approve-cost:${c.id}`):''}</td></tr>`).join('')}</tbody></table></div></div><div class="card section"><h2>ETC ainda não comprometido</h2>${financialList(D.forecastExtras.map(x=>[`${wbsName(x.wbs)} · ${x.description}`,x.amount]))}</div></div><div class="card section"><h2>Pagamentos</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>NF</th><th>Data</th><th>Valor</th><th>Status</th></tr></thead><tbody>${D.payments.map(p=>`<tr><td>${h(p.id)}</td><td>${h(p.invoice)}</td><td>${dateBR(p.date)}</td><td>${money(p.amount)}</td><td>${statusPill(p.status)}</td></tr>`).join('')}</tbody></table></div></div>`}

function contractsTable(list){return `<div class="table-wrap"><table><thead><tr><th>Contrato</th><th>Fornecedor</th><th>Original</th><th>Aditivos</th><th>Atual</th><th>Medido</th><th>Saldo</th><th>Status</th></tr></thead><tbody>${list.map(c=>{const base=contractBase(c),ad=sum(approvedAmendments(c.id),a=>a.amount),v=contractValue(c),m=measuredContract(c.id);return `<tr class="clickable-row" data-open-contract="${h(c.id)}"><td><b>${h(c.number)}</b><br><span class="muted">${h(c.name)}</span></td><td>${h(c.supplier)}</td><td>${moneyM(base)}</td><td>${moneyM(ad)}</td><td>${moneyM(v)}</td><td>${moneyM(m)}</td><td>${moneyM(v-m)}</td><td>${statusPill(c.status)}</td></tr>`}).join('')}</tbody></table></div>`}
function contractsPage(){const actions=can('contratos','create')?btn('Novo contrato','newContract',true):'';if(state.context){const c=D.contracts.find(x=>x.id===state.context);if(c)return contractDetail(c,actions)}return pageHead('Contratos','Contratos de terceiros, itens EAP/CBS, aditivos, medições e saldo.',actions)+`<div class="card section">${contractsTable(D.contracts)}</div>`}
function contractDetail(c,actions){const base=contractBase(c),ad=sum(approvedAmendments(c.id),a=>a.amount),current=contractValue(c),measured=measuredContract(c.id),saldo=current-measured;const headerActions=`${btn('Voltar','backContracts')}${actions}${can('contratos','edit')?btn('Novo aditivo','newAmendment'):''}${['rascunho','em_aprovacao'].includes(c.status)&&can('contratos','approve')?btn('Aprovar contrato','approveContract',true):''}`;return pageHead(`${c.number} · ${c.name}`,`${c.supplier} · ${dateBR(c.start)} a ${dateBR(c.end)}`,headerActions)+`<div class="kpi-grid"><div class="card kpi"><div class="kpi-label">ORIGINAL</div><div class="kpi-value">${moneyM(base)}</div></div><div class="card kpi"><div class="kpi-label">ADITIVOS APROVADOS</div><div class="kpi-value">${moneyM(ad)}</div></div><div class="card kpi"><div class="kpi-label">MEDIDO</div><div class="kpi-value">${moneyM(measured)}</div></div><div class="card kpi"><div class="kpi-label">SALDO</div><div class="kpi-value">${moneyM(saldo)}</div></div></div><div class="grid-2"><div class="card section"><h2>Itens contratuais</h2><table><thead><tr><th>EAP</th><th>CBS</th><th>Descrição</th><th>Qtd.</th><th>Un.</th><th>Valor</th></tr></thead><tbody>${c.items.map(i=>`<tr><td>${h(wbsName(i.wbs))}</td><td>${h(cbsName(i.cbs))}</td><td>${h(i.description)}</td><td>${h(i.qty||1)}</td><td>${h(i.unit||'vb')}</td><td>${money(i.amount)}</td></tr>`).join('')}</tbody></table></div><div class="card section"><h2>Aditivos / supressões</h2><table><thead><tr><th>Nº</th><th>Tipo</th><th>Descrição</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${D.contractAmendments.filter(a=>a.contract===c.id).map(a=>`<tr><td>${h(a.number)}</td><td>${h(a.type)}</td><td>${h(a.description)}</td><td>${money(a.amount)}</td><td>${statusPill(a.status)}</td><td>${a.status==='em_aprovacao'&&can('contratos','approve')?iconBtn('Aprovar',`approve-amendment:${a.id}`):''}</td></tr>`).join('')||'<tr><td colspan="6">Sem aditivos.</td></tr>'}</tbody></table></div></div><div class="card section"><h2>Medições do contrato</h2>${measurementsTable(D.measurements.filter(m=>m.contract===c.id))}</div>`}

function measurementsTable(list){return `<div class="table-wrap"><table><thead><tr><th>Boletim</th><th>Contrato</th><th>Período</th><th>Data</th><th>Valor</th><th>Status</th><th></th></tr></thead><tbody>${list.map(m=>`<tr><td><b>${h(m.id)}</b></td><td>${h(m.contract)}</td><td>${h(m.period||'')}</td><td>${dateBR(m.date)}</td><td>${money(m.amount)}</td><td>${statusPill(m.status)}</td><td>${m.status==='em_aprovacao'&&can('medicoes','approve')?iconBtn('Aprovar',`approve-measurement:${m.id}`):''}</td></tr>`).join('')}</tbody></table></div>`}
function measurementsPage(){const actions=can('medicoes','create')?btn('Nova medição','newMeasurement',true):'';const approved=sum(D.measurements.filter(m=>m.status==='aprovada'),m=>m.amount);const pending=sum(D.measurements.filter(m=>m.status!=='aprovada'),m=>m.amount);return pageHead('Medições','Boletins por contrato, competência, aprovação e saldo.',actions)+`<div class="kpi-grid"><div class="card kpi"><div class="kpi-label">APROVADO ACUMULADO</div><div class="kpi-value">${moneyM(approved)}</div></div><div class="card kpi"><div class="kpi-label">EM FLUXO</div><div class="kpi-value">${moneyM(pending)}</div></div><div class="card kpi"><div class="kpi-label">BOLETINS</div><div class="kpi-value">${D.measurements.length}</div></div><div class="card kpi"><div class="kpi-label">CONTRATOS MEDIDOS</div><div class="kpi-value">${new Set(D.measurements.map(m=>m.contract)).size}</div></div></div><div class="card section">${measurementsTable(D.measurements)}</div>`}

function invoicesPage(){const actions=can('nfs','create')?btn('Nova NF','newInvoice',true):'';const total=sum(D.invoices,n=>n.amount),paid=sum(D.payments.filter(p=>p.status==='pago'),p=>p.amount),payable=Math.max(0,sum(D.invoices.filter(n=>['aprovada','paga'].includes(n.status)),n=>n.amount)-paid);return pageHead('Notas Fiscais','Documento fiscal ligado à origem do custo, aprovação e pagamento.',actions)+`<div class="kpi-grid"><div class="card kpi"><div class="kpi-label">VALOR FISCAL</div><div class="kpi-value">${moneyM(total)}</div></div><div class="card kpi"><div class="kpi-label">PAGO</div><div class="kpi-value">${moneyM(paid)}</div></div><div class="card kpi"><div class="kpi-label">A PAGAR APROVADO</div><div class="kpi-value">${moneyM(payable)}</div></div><div class="card kpi"><div class="kpi-label">DOCUMENTOS</div><div class="kpi-value">${D.invoices.length}</div></div></div><div class="card section"><div class="table-wrap"><table><thead><tr><th>NF</th><th>Fornecedor</th><th>Data</th><th>Origem</th><th>Valor</th><th>Pago</th><th>Status</th><th></th></tr></thead><tbody>${D.invoices.map(n=>{const p=invoicePaidAmount(n.id);return `<tr><td><b>${h(n.number)}</b></td><td>${h(n.supplier)}</td><td>${dateBR(n.date)}</td><td>${h(n.source||'Direto')}</td><td>${money(n.amount)}</td><td>${money(p)}</td><td>${statusPill(n.status)}</td><td>${n.status==='em_aprovacao'&&can('nfs','approve')?iconBtn('Aprovar',`approve-invoice:${n.id}`):''}${n.status==='aprovada'&&can('custos','approve')&&p<n.amount?iconBtn('Pagar',`pay-invoice:${n.id}`):''}</td></tr>`}).join('')}</tbody></table></div></div>`}

function planningPage(){let actions='';if(can('planejamento','create')){if(state.planningTab==='cronograma')actions=btn('Nova atividade','newPlanActivity',true);if(state.planningTab==='semanal')actions=btn('Novo item semanal','newWeeklyPlan',true);if(state.planningTab==='quinzenal')actions=btn('Novo item quinzenal','newFortnightPlan',true);if(state.planningTab==='restricoes')actions=btn('Nova restrição','newRestriction',true)}const tb=tabs([{id:'cronograma',label:'Cronograma / Avanço'},{id:'semanal',label:'Semanal'},{id:'quinzenal',label:'Quinzenal'},{id:'restricoes',label:'Restrições'},{id:'curvas',label:'Curva S'}],state.planningTab,'planning');let body='';
  if(state.planningTab==='cronograma')body=`<div class="card section"><div class="table-wrap"><table><thead><tr><th>EAP</th><th>Atividade</th><th>Início</th><th>Fim</th><th>Responsável</th><th>Plan.</th><th>Real</th><th>Desvio</th><th>Crítica</th></tr></thead><tbody>${D.planning.map(p=>`<tr><td>${h(wbsName(p.wbs))}</td><td>${h(p.activity)}</td><td>${dateBR(p.start)}</td><td>${dateBR(p.end)}</td><td>${h(p.owner)}</td><td>${pct(p.planned)}</td><td>${pct(p.actual)}</td><td class="${p.actual<p.planned?'metric-negative':'metric-positive'}">${(p.actual-p.planned).toFixed(1)} p.p.</td><td>${p.critical?statusPill('Crítica'):statusPill('Normal')}</td></tr>`).join('')}</tbody></table></div></div>`;
  if(state.planningTab==='semanal')body=`<div class="kpi-grid"><div class="card kpi"><div class="kpi-label">PPC</div><div class="kpi-value">${pct(ppc())}</div></div><div class="card kpi"><div class="kpi-label">ITENS</div><div class="kpi-value">${D.weeklyPlan.length}</div></div><div class="card kpi"><div class="kpi-label">CONCLUÍDOS</div><div class="kpi-value">${D.weeklyPlan.filter(x=>x.status==='concluida').length}</div></div><div class="card kpi"><div class="kpi-label">EM ANDAMENTO</div><div class="kpi-value">${D.weeklyPlan.filter(x=>x.status==='em_andamento').length}</div></div></div><div class="card section"><table><thead><tr><th>EAP</th><th>Atividade</th><th>Responsável</th><th>Planejado</th><th>Real</th><th>Aderência</th><th>Status</th><th></th></tr></thead><tbody>${D.weeklyPlan.map(x=>`<tr><td>${h(wbsName(x.wbs))}</td><td>${h(x.activity)}</td><td>${h(x.owner)}</td><td>${h(x.plannedQty)} ${h(x.unit)}</td><td>${h(x.actualQty)} ${h(x.unit)}</td><td>${pct(x.plannedQty?x.actualQty/x.plannedQty*100:0)}</td><td>${statusPill(x.status)}</td><td>${can('planejamento','edit')&&x.status!=='concluida'?iconBtn('Concluir',`complete-week:${x.id}`):''}</td></tr>`).join('')}</tbody></table></div>`;
  if(state.planningTab==='quinzenal')body=`<div class="card section"><table><thead><tr><th>EAP</th><th>Entrega</th><th>Responsável</th><th>Prazo</th><th>Status</th><th></th></tr></thead><tbody>${D.fortnightPlan.map(x=>`<tr><td>${h(wbsName(x.wbs))}</td><td>${h(x.activity)}</td><td>${h(x.owner)}</td><td>${dateBR(x.due)}</td><td>${statusPill(x.status)}</td><td>${can('planejamento','edit')&&x.status!=='concluida'?iconBtn('Concluir',`complete-fortnight:${x.id}`):''}</td></tr>`).join('')}</tbody></table></div>`;
  if(state.planningTab==='restricoes')body=`<div class="card section"><table><thead><tr><th>ID</th><th>EAP</th><th>Restrição</th><th>Responsável</th><th>Prazo</th><th>Status</th><th></th></tr></thead><tbody>${D.restrictions.map(r=>`<tr><td>${h(r.id)}</td><td>${h(wbsName(r.wbs))}</td><td>${h(r.title)}</td><td>${h(r.owner)}</td><td>${dateBR(r.due)}</td><td>${statusPill(r.status)}</td><td>${can('planejamento','edit')&&r.status!=='concluida'?iconBtn('Resolver',`resolve-restriction:${r.id}`):''}</td></tr>`).join('')}</tbody></table></div>`;
  if(state.planningTab==='curvas')body=`<div class="card section"><h2>Curva S física</h2><div class="curve-grid">${D.curveS.map(x=>`<div class="curve-col"><div class="curve-bars"><span class="curve-plan" style="height:${num(x.planned)}%" title="Planejado ${x.planned}%"></span>${x.actual!==null?`<span class="curve-real" style="height:${num(x.actual)}%" title="Real ${x.actual}%"></span>`:''}</div><small>${h(x.period)}</small><b>${x.actual!==null?h(x.actual)+'%':'—'}</b></div>`).join('')}</div><div class="legend"><span><i class="legend-plan"></i>Planejado</span><span><i class="legend-real"></i>Real</span></div></div>`;

function rdoDefaultClimate(r){
  const cond=(r.condition||'praticavel')==='impraticavel'?'impraticavel':'praticavel';
  const norm=v=>String(v||'').toLowerCase().replace('sol','sol').replace('nublado','nublado').replace('chuva','chuva');
  return {
    madrugada:{tempo:'',chuvaMm:0,operacao:cond},
    manha:{tempo:norm(r.weatherMorning||r.weather),chuvaMm:0,operacao:cond},
    tarde:{tempo:norm(r.weatherAfternoon||r.weather),chuvaMm:0,operacao:cond},
    noite:{tempo:'',chuvaMm:0,operacao:cond}
  };
}
function rdoNormalize(r){
  if(!r)return r;
  r.status=r.status||'rascunho';
  r.location=r.location||{local:'',description:''};
  r.climate=r.climate||rdoDefaultClimate(r);
  for(const p of ['madrugada','manha','tarde','noite'])r.climate[p]=Object.assign({tempo:'',chuvaMm:0,operacao:'praticavel'},r.climate[p]||{});
  r.journey=r.journey||{start:'07:00',lunchStart:'12:00',lunchEnd:'13:00',end:'17:00'};
  r.dssDetail=r.dssDetail||{time:'07:00',instructor:'',theme:r.dss||''};
  r.attendance=r.attendance||[];
  r.equipmentUse=r.equipmentUse||[];
  r.activities=r.activities||[];
  if(!r.activities.length&&r.progress)r.activities.push({id:uid('RAT'),catalogId:'',description:r.progress,location:'',qty:0,unit:'',status:'andamento',wbs:''});
  r.pausedActivities=r.pausedActivities||[];
  r.safetyEvents=r.safetyEvents||[];
  r.environmentEvents=r.environmentEvents||[];
  r.photos=r.photos||[];
  r.responsible=r.responsible||'';
  r.signatures=r.signatures||{};
  r.notes=r.notes||'';
  return r;
}
D.rdos.forEach(rdoNormalize);

function rdoActivitiesEditor(r){const rows=D.activitiesCatalog.filter(a=>a.active).map(a=>{let x=r.activities.find(v=>v.catalogId===a.id);if(!x)x={id:'',catalogId:a.id,description:a.description,location:'',qty:0,unit:a.unit,status:'nao_executada',wbs:''};const marked=!!r.activities.find(v=>v.catalogId===a.id);return `<tr><td><label class="check-label"><input type="checkbox" ${marked?'checked':''} data-rdo-activity-toggle="${h(a.id)}"> <b>${h(a.description)}</b></label></td><td><select data-rdo-act="${h(a.id)}" data-key="wbs">${rdoWbsOptions(x.wbs)}</select></td><td><input value="${h(x.location||'')}" data-rdo-act="${h(a.id)}" data-key="location"></td><td><input type="number" step="0.001" min="0" value="${h(x.qty||0)}" data-rdo-act="${h(a.id)}" data-key="qty"></td><td>${h(a.unit||x.unit||'—')}</td><td><select data-rdo-act="${h(a.id)}" data-key="status">${option('andamento','Em andamento',x.status==='andamento')}${option('concluida','Concluída',x.status==='concluida')}${option('paralisada','Paralisada',x.status==='paralisada')}${option('nao_executada','Não executada',x.status==='nao_executada')}</select></td></tr>`}).join('');const extras=r.activities.filter(x=>!x.catalogId).map(x=>`<div class="list-row"><div><b>${h(x.description)}</b><div class="muted">${h(x.location||'Sem local')} · ${h(x.qty||0)} ${h(x.unit||'')} · ${h(x.status||'andamento')}</div></div>${iconBtn('×',`rdo-remove-extra:${x.id}`,'Remover')}</div>`).join('');return `<div class="table-wrap"><table class="rdo-detail-table"><thead><tr><th>Atividade</th><th>EAP</th><th>Local</th><th>Qtd.</th><th>Un.</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div><div class="gap-top">${extras||''}${btn('+ Atividade avulsa','rdoAddActivity')}</div>`}
function rdoEventsEditor(r,kind){const arr=kind==='safety'?r.safetyEvents:r.environmentEvents;return `<div class="list">${arr.map(ev=>`<div class="list-row"><div><b>${h(ev.type)}</b> ${statusPill(ev.severity)}<div class="muted">${h(ev.description||'')}</div>${ev.action?`<div class="muted"><b>Ação:</b> ${h(ev.action)}</div>`:''}</div>${iconBtn('×',`rdo-remove-event:${kind}:${ev.id}`,'Remover')}</div>`).join('')||empty('Nenhum evento registrado.')}</div>${btn('+ Registrar evento',kind==='safety'?'rdoAddSafety':'rdoAddEnvironment')}`}
function rdoPhotosEditor(r){return `<div class="rdo-photo-grid">${r.photos.map((f,i)=>`<div class="rdo-photo"><img src="${h(f.dataUrl)}" alt="Foto ${i+1}"><input placeholder="Legenda" value="${h(f.caption||'')}" data-rdo-photo="${i}" data-key="caption"><select data-rdo-photo="${i}" data-key="activityId"><option value="">Geral</option>${r.activities.map(a=>option(a.id,a.description.slice(0,50),a.id===f.activityId)).join('')}</select>${iconBtn('Remover',`rdo-remove-photo:${i}`,'Remover foto')}</div>`).join('')}</div><div class="info-box">${r.photos.length}/20 fotos · no modo offline as imagens são compactadas e ficam apenas neste navegador.</div>${r.photos.length<20?`${btn('📷 Adicionar foto','rdoAddPhoto')}<input type="file" id="rdoPhotoInput" accept="image/*" style="display:none">`:''}`}
function rdoEditor(r){const editable=can('rdo','edit')||can('rdo','create');return `<div class="rdo-autosave">✓ Salvamento automático campo a campo · data no fuso da obra (America/Sao_Paulo)</div><div class="rdo-editor ${editable?'':'readonly'}"><div class="card section"><h2>📅 Data e local</h2><div class="form-grid">${field('Data',`<input type="date" value="${h(r.date)}" data-rdo-field="date">`)}${field('Local da obra',`<input value="${h(r.location.local)}" data-rdo-field="location.local" placeholder="Ex.: Bloco A — 2º pavimento">`,true)}${field('Descrição do local',`<textarea data-rdo-field="location.description">${h(r.location.description)}</textarea>`,true)}</div><div class="actions gap-top">${btn('Copiar do último diário','rdoCopyPrevious')}</div></div><div class="card section"><h2>🌤 Condições do tempo</h2><div class="rdo-climate-grid">${rdoClimateCard(r,'madrugada','Madrugada')}${rdoClimateCard(r,'manha','Manhã')}${rdoClimateCard(r,'tarde','Tarde')}${rdoClimateCard(r,'noite','Noite')}</div></div><div class="card section"><h2>⏰ Jornada de trabalho</h2><div class="rdo-inline-4"><label>Início<input type="time" value="${h(r.journey.start)}" data-rdo-field="journey.start"></label><label>Início almoço<input type="time" value="${h(r.journey.lunchStart)}" data-rdo-field="journey.lunchStart"></label><label>Fim almoço<input type="time" value="${h(r.journey.lunchEnd)}" data-rdo-field="journey.lunchEnd"></label><label>Fim<input type="time" value="${h(r.journey.end)}" data-rdo-field="journey.end"></label></div></div><div class="card section"><h2>📋 DSS — Diálogo Diário de Segurança</h2><div class="form-grid">${field('Horário',`<input type="time" value="${h(r.dssDetail.time)}" data-rdo-field="dssDetail.time">`)}${field('Ministrado por',`<select data-rdo-field="dssDetail.instructor">${rdoPersonOptions(r.dssDetail.instructor)}</select>`)}${field('Tema',`<textarea data-rdo-field="dssDetail.theme">${h(r.dssDetail.theme)}</textarea>`,true)}</div></div><div class="card section"><h2>👷 Efetivo</h2><div class="kpi-strip"><span>Presentes <b>${rdoAttendanceCount(r)}</b></span><span>Cadastro <b>${D.people.filter(p=>p.status==='ativo').length}</b></span><span>Homem-hora <b>${sum(r.attendance.filter(a=>a.status==='presente'),a=>num(a.normal)+num(a.extra)).toLocaleString('pt-BR')}</b></span></div>${rdoAttendanceEditor(r)}</div><div class="card section"><h2>🚜 Equipamentos e veículos utilizados</h2>${rdoEquipmentEditor(r)}</div><div class="card section"><h2>🛠 Atividades do dia</h2>${rdoActivitiesEditor(r)}</div><div class="card section"><h2>⏸ Atividades paralisadas</h2><div class="list">${r.pausedActivities.map(x=>`<div class="list-row"><div><b>${h(x.description)}</b><div class="muted">${h(x.reason||'Sem justificativa')}</div></div>${iconBtn('×',`rdo-remove-paused:${x.id}`)}</div>`).join('')||empty('Nenhuma atividade paralisada.')}</div>${btn('+ Adicionar atividade paralisada','rdoAddPaused')}</div><div class="card section"><h2>📝 Observações do dia</h2><textarea data-rdo-field="notes" class="rdo-big-text">${h(r.notes)}</textarea></div><div class="grid-2"><div class="card section"><h2>🦺 Eventos de Segurança</h2>${rdoEventsEditor(r,'safety')}</div><div class="card section"><h2>🌱 Eventos de Meio Ambiente</h2>${rdoEventsEditor(r,'environment')}</div></div><div class="card section"><h2>📷 Fotos do dia</h2>${rdoPhotosEditor(r)}</div><div class="card section"><h2>✍️ Apontador responsável</h2><select data-rdo-field="responsible">${rdoPersonOptions(r.responsible)}</select><div class="actions gap-top">${r.status!=='emitido'?btn('Concluir / Emitir RDO','rdoFinalize',true):statusPill('emitido')}${can('rdo','delete')?btn('Excluir RDO','rdoDelete'):''}</div></div></div>`}
function rdoText(r){const acts=r.activities.filter(a=>a.status!=='nao_executada').map(a=>`• ${a.description}${a.location?' — '+a.location:''}${num(a.qty)?` — ${a.qty} ${a.unit||''}`:''} [${a.status}]`).join('\n')||'• Sem atividades';const ev=[...r.safetyEvents,...r.environmentEvents];return `RDO Nº ${String(r.number).padStart(3,'0')} — ${dateBR(r.date)}\nObra: ${state.work.name}\nLocal: ${r.location.local||'—'}\nClima: manhã ${rdoWeatherLabel(r,'manha')} / tarde ${rdoWeatherLabel(r,'tarde')} · chuva ${rdoRain(r).toFixed(1)} mm\nEfetivo: ${rdoAttendanceCount(r)} presentes\nEquipamentos: ${rdoEquipCount(r)} utilizados\nDSS: ${r.dssDetail.theme||'—'}\n\nATIVIDADES\n${acts}\n\nOBSERVAÇÕES\n${r.notes||'—'}${ev.length?`\n\nEVENTOS SSMA: ${ev.length}`:''}`}
function rdoReport(r){const climate=['madrugada','manha','tarde','noite'].map(p=>{const x=r.climate[p];return `<tr><td>${p[0].toUpperCase()+p.slice(1)}</td><td>${h(rdoWeatherLabel(r,p))}</td><td>${h(x.operacao)}</td><td>${num(x.chuvaMm).toLocaleString('pt-BR')}</td></tr>`}).join('');const acts=r.activities.filter(a=>a.status!=='nao_executada').map((a,i)=>`<tr><td>${i+1}</td><td>${h(a.description)}</td><td>${h(a.location||'—')}</td><td>${h(a.qty||'—')} ${h(a.unit||'')}</td><td>${h(a.status)}</td></tr>`).join('');const att=r.attendance.filter(a=>a.status==='presente').map(a=>{const p=rdoPerson(a.person);return `<tr><td>${h(p?.name||a.person)}</td><td>${h(p?.function||'')}</td><td>${h(a.normal)}</td><td>${h(a.extra)}</td></tr>`}).join('');const eq=r.equipmentUse.filter(x=>x.active).map(x=>{const e=rdoEquipment(x.equipment);return `<tr><td>${h(e?.prefix||'')}</td><td>${h(e?.type||'')}</td><td>${h(rdoPerson(x.operator)?.name||'—')}</td><td>${h(x.status)}</td><td>${h(x.hoursOperating)}</td><td>${h(x.hoursStopped)}</td></tr>`}).join('');const events=[...r.safetyEvents.map(x=>({...x,domain:'Segurança'})),...r.environmentEvents.map(x=>({...x,domain:'Meio Ambiente'}))];return `<div class="rdo-report rdo-print-area" id="rdoReportPrint"><div class="rdo-report-head"><div><h1>RELATÓRIO DIÁRIO DE OBRA</h1><b>${h(state.work.name)}</b><div>${h(state.work.code||'')} · ${dateBR(r.date)}</div></div><div class="rdo-number">RDO<br><b>${String(r.number).padStart(3,'0')}</b></div></div><div class="kpi-strip"><span>Efetivo <b>${rdoAttendanceCount(r)}</b></span><span>Equipamentos <b>${rdoEquipCount(r)}</b></span><span>Atividades <b>${r.activities.filter(a=>a.status!=='nao_executada').length}</b></span><span>Chuva <b>${rdoRain(r).toFixed(1)} mm</b></span><span>Fotos <b>${r.photos.length}</b></span></div><h2>Identificação</h2><p><b>Local:</b> ${h(r.location.local||'—')}<br>${h(r.location.description||'')}</p><h2>Condições climáticas</h2><table><thead><tr><th>Período</th><th>Tempo</th><th>Operação</th><th>mm</th></tr></thead><tbody>${climate}</tbody></table><h2>Jornada e DSS</h2><p><b>Jornada:</b> ${h(r.journey.start)}–${h(r.journey.lunchStart)} / ${h(r.journey.lunchEnd)}–${h(r.journey.end)}<br><b>DSS:</b> ${h(r.dssDetail.time)} · ${h(rdoPerson(r.dssDetail.instructor)?.name||'—')} · ${h(r.dssDetail.theme||'—')}</p><h2>Atividades do dia</h2><table><thead><tr><th>#</th><th>Descrição</th><th>Local</th><th>Quantidade</th><th>Status</th></tr></thead><tbody>${acts||'<tr><td colspan="5">Sem atividades</td></tr>'}</tbody></table><h2>Efetivo</h2><table><thead><tr><th>Nome</th><th>Função</th><th>HN</th><th>HE</th></tr></thead><tbody>${att||'<tr><td colspan="4">Sem presença detalhada</td></tr>'}</tbody></table><h2>Equipamentos</h2><table><thead><tr><th>Prefixo</th><th>Tipo</th><th>Operador</th><th>Status</th><th>H. op.</th><th>H. parada</th></tr></thead><tbody>${eq||'<tr><td colspan="6">Sem equipamentos</td></tr>'}</tbody></table>${r.pausedActivities.length?`<h2>Atividades paralisadas</h2><ul>${r.pausedActivities.map(x=>`<li><b>${h(x.description)}</b> — ${h(x.reason||'Sem justificativa')}</li>`).join('')}</ul>`:''}${events.length?`<h2>Eventos SSMA</h2><ul>${events.map(x=>`<li><b>${h(x.domain)} · ${h(x.type)} (${h(x.severity)})</b> — ${h(x.description)}${x.action?' · Ação: '+h(x.action):''}</li>`).join('')}</ul>`:''}<h2>Observações</h2><p>${h(r.notes||'—')}</p>${r.photos.length?`<h2>Registro fotográfico</h2><div class="rdo-report-photos">${r.photos.map(f=>`<figure><img src="${h(f.dataUrl)}"><figcaption>${h(f.caption||'')}</figcaption></figure>`).join('')}</div>`:''}<div class="rdo-sign-grid"><div>${r.signatures.apontador?`<img src="${h(r.signatures.apontador)}">`:''}<div class="sig-line"></div><b>${h(rdoPerson(r.responsible)?.name||'Apontador')}</b><br>Apontador</div><div>${r.signatures.fiscal?`<img src="${h(r.signatures.fiscal)}">`:''}<div class="sig-line"></div><b>Fiscalização / Cliente</b></div></div></div>`}
function rdoSummary(){const base=rdoSelected()?.date||todayISO();const d=new Date(base+'T12:00:00');let start,end;if(state.rdoSummaryMode==='ano'){start=`${d.getFullYear()}-01-01`;end=`${d.getFullYear()}-12-31`}else if(state.rdoSummaryMode==='semana'){const day=(d.getDay()+6)%7;const a=new Date(d);a.setDate(a.getDate()-day);const b=new Date(a);b.setDate(b.getDate()+6);start=a.toISOString().slice(0,10);end=b.toISOString().slice(0,10)}else{start=`${base.slice(0,7)}-01`;const b=new Date(d.getFullYear(),d.getMonth()+1,0);end=b.toISOString().slice(0,10)}const rows=D.rdos.map(rdoNormalize).filter(r=>r.date>=start&&r.date<=end);const qty={};rows.forEach(r=>r.activities.filter(a=>a.status!=='nao_executada').forEach(a=>{const k=a.description+'|'+(a.unit||'');qty[k]=(qty[k]||0)+num(a.qty)}));return `<div class="rdo-summary-controls">${tabs([{id:'semana',label:'Semana'},{id:'mes',label:'Mês'},{id:'ano',label:'Ano'}],state.rdoSummaryMode,'rdoSummary')}</div><div class="grid-4"><div class="card metric"><span>Dias registrados</span><b>${rows.length}</b></div><div class="card metric"><span>Efetivo médio</span><b>${rows.length?avg(rows.map(rdoAttendanceCount)).toFixed(1):'0'}</b></div><div class="card metric"><span>Chuva acumulada</span><b>${sum(rows,rdoRain).toFixed(1)} mm</b></div><div class="card metric"><span>Fotos</span><b>${sum(rows,r=>r.photos.length)}</b></div></div><div class="grid-2 gap-top"><div class="card section"><h2>🛠 Serviços executados</h2>${Object.keys(qty).length?`<table><thead><tr><th>Serviço</th><th>Total</th></tr></thead><tbody>${Object.entries(qty).map(([k,v])=>`<tr><td>${h(k.split('|')[0])}</td><td>${v.toLocaleString('pt-BR')} ${h(k.split('|')[1])}</td></tr>`).join('')}</tbody></table>`:empty('Sem quantidades no período.')}</div><div class="card section"><h2>👷 Efetivo por dia</h2>${rows.length?`<table><thead><tr><th>Data</th><th>Presentes</th><th>H-H</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${dateBR(r.date)}</td><td>${rdoAttendanceCount(r)}</td><td>${sum(r.attendance.filter(a=>a.status==='presente'),a=>num(a.normal)+num(a.extra)).toLocaleString('pt-BR')}</td></tr>`).join('')}</tbody></table>`:empty()}</div></div>`}
function rdoCalendar(){const [y,m]=state.rdoCalendarAnchor.split('-').map(Number);const first=new Date(y,m-1,1),last=new Date(y,m,0);const cells=[];for(let i=0;i<first.getDay();i++)cells.push('<div class="rdo-cal-cell blank"></div>');for(let day=1;day<=last.getDate();day++){const date=`${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;const r=D.rdos.find(x=>x.date===date);cells.push(`<button class="rdo-cal-cell ${r?'has-rdo':''}" ${r?`data-rdo="${h(r.id)}"`:''}><b>${day}</b>${r?`<span>RDO ${String(r.number).padStart(3,'0')}</span>`:''}</button>`)}return `<div class="card section"><div class="rdo-cal-head">${btn('‹','rdoCalPrev')}<h2>${first.toLocaleDateString('pt-BR',{month:'long',year:'numeric'})}</h2>${btn('›','rdoCalNext')}</div><div class="rdo-cal-week">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<b>${x}</b>`).join('')}</div><div class="rdo-calendar-grid">${cells.join('')}</div></div>`}
function rdoCadastro(){return `<div class="grid-3"><div class="card section"><h2>👷 Equipe</h2><p>${D.people.filter(p=>p.status==='ativo').length} colaboradores ativos vinculados ao Cadastro Premium.</p>${btn('Abrir Efetivo','rdoGoWorkforce',true)}</div><div class="card section"><h2>🚜 Equipamentos</h2><p>${D.equipment.length} equipamentos/veículos disponíveis para apontamento.</p>${btn('Abrir Equipamentos','rdoGoEquipment',true)}</div><div class="card section"><h2>🛠 Atividades</h2><p>${D.activitiesCatalog.filter(a=>a.active).length} atividades do catálogo corporativo disponíveis.</p>${btn('Abrir Cadastro','rdoGoCatalog',true)}</div></div><div class="card section gap-top"><h2>Regra recuperada do RDO anterior</h2><p>O RDO usa os cadastros corporativos/da obra e não mantém listas paralelas. O apontamento diário registra presença, horas, atividade, quantidade, equipamento, operador, clima, SSMA, fotos e assinaturas preservando o histórico.</p></div>`}
function rdoPage(){const selected=rdoSelected();const actions=can('rdo','create')?btn('Novo RDO','newRdo',true):'';const top=pageHead('RDO','Diário completo recuperado do BUILDLy V1: campo, clima, jornada, DSS, efetivo, equipamentos, atividades, SSMA, fotos, assinaturas, resumo e calendário.',actions);const nav=tabs([{id:'diario',label:'📝 Diário'},{id:'gerar',label:'📤 Gerar'},{id:'resumo',label:'📊 Resumo'},{id:'calendario',label:'📅 Calendário'},{id:'cadastro',label:'⚙ Cadastro'}],state.rdoTab,'rdo');let body='';if(state.rdoTab==='diario')body=selected?`${rdoEditor(selected)}<div class="card section gap-top"><h2>Histórico</h2>${rdoTable(D.rdos)}</div>`:`<div class="card section">${rdoTable(D.rdos)}</div>`;if(state.rdoTab==='gerar')body=selected?`<div class="actions gap-bottom">${btn('Imprimir / Salvar PDF','printRdo',true)}${btn('Copiar texto','rdoCopyText')}${btn(selected.signatures.apontador?'Refazer assinatura apontador':'Assinar apontador','rdoSignApontador')}${btn(selected.signatures.fiscal?'Refazer assinatura fiscalização':'Assinar fiscalização','rdoSignFiscal')}</div>${rdoReport(selected)}`:empty('Selecione um RDO.');if(state.rdoTab==='resumo')body=rdoSummary();if(state.rdoTab==='calendario')body=rdoCalendar();if(state.rdoTab==='cadastro')body=rdoCadastro();return top+nav+`<div class="gap-top">${body}</div>`}
function reportsPage(f){const actions=can('relatorios','generate')?`${btn('Imprimir executivo','printExecutive',true)}${btn('Exportar financeiro CSV','csvFinancial')}${btn('Exportar RDO CSV','csvRdo')}`:'';return pageHead('Relatórios','Visões executivas, financeiras e operacionais para emissão.',actions)+`<div id="reportArea"><div class="grid-3"><div class="card section"><h3>Resumo executivo</h3>${financialList([['Orçamento atual',f.current],['Comprometido',f.commitments],['Realizado',f.realized],['Forecast',f.forecast]])}</div><div class="card section"><h3>Produção</h3>${financialList([['Avanço físico',61.8],['PPC semanal',ppc()],['RDOs emitidos',D.rdos.length],['Restrições abertas',D.restrictions.filter(r=>r.status!=='concluida').length]])}</div><div class="card section"><h3>Gestão</h3>${financialList([['Contratos ativos',D.contracts.filter(c=>c.status==='ativo').length],['Tarefas abertas',D.tasks.filter(t=>t.status!=='concluida').length],['Alertas não lidos',D.alerts.filter(a=>!a.read).length],['Documentos',D.documents.length]])}</div></div><div class="card section gap-top"><h2>Resumo de EAP</h2><table><thead><tr><th>EAP</th><th>Planejado</th><th>Real</th><th>Desvio</th></tr></thead><tbody>${D.wbs.filter(w=>!w.parent).map(w=>`<tr><td>${h(w.code+' '+w.name)}</td><td>${pct(w.planned)}</td><td>${pct(w.progress)}</td><td class="${w.progress<w.planned?'metric-negative':'metric-positive'}">${(w.progress-w.planned).toFixed(1)} p.p.</td></tr>`).join('')}</tbody></table></div></div>`}


function eapPage(){
  const actions=can('orcamento','edit')?btn('Novo item EAP','newEap',true):'';
  const rows=[...D.wbs].sort((a,b)=>a.code.localeCompare(b.code,'pt-BR',{numeric:true}));
  return pageHead('EAP da Obra','Estrutura hierárquica que integra planejamento, orçamento, contratos, custos e documentos.',actions)+`<div class="card section"><table><thead><tr><th>Código</th><th>Nome</th><th>Pai</th><th>Planejado</th><th>Real</th><th>Nível</th></tr></thead><tbody>${rows.map(w=>`<tr><td><b>${h(w.code)}</b></td><td>${h(w.name)}</td><td>${h(w.parent?wbsName(w.parent):'Raiz')}</td><td>${pct(w.planned)}</td><td>${pct(w.progress)}</td><td>${w.parent?'Pacote':'Grupo'}</td></tr>`).join('')}</tbody></table><div class="info-box">Itens já vinculados a orçamento, contratos ou planejamento não devem ser apagados; devem ser inativados no backend produtivo.</div></div>`;
}
function procurementCommitted(){return sum((D.purchaseOrders||[]).filter(poApproved),p=>p.amount)}
function suppliesPage(){
  const actions=can('suprimentos','create')?`${btn('Nova solicitação','newPurchaseRequest',true)}${btn('Nova cotação','newPurchaseQuote')}`:'';
  const tb=tabs([{id:'requisicoes',label:'Solicitações'},{id:'cotacoes',label:'Cotações'},{id:'pedidos',label:'Pedidos de Compra'},{id:'recebimentos',label:'Recebimentos'}],state.procurementTab,'procurement');
  let body='';
  if(state.procurementTab==='requisicoes')body=`<div class="card section"><table><thead><tr><th>Número</th><th>EAP</th><th>CBS</th><th>Descrição</th><th>Estimado</th><th>Responsável</th><th>Status</th></tr></thead><tbody>${(D.purchaseRequests||[]).map(r=>`<tr><td><b>${h(r.number)}</b></td><td>${h(wbsName(r.wbs))}</td><td>${h(cbsName(r.cbs))}</td><td>${h(r.description)}</td><td>${money(r.estimated)}</td><td>${h(r.owner)}</td><td>${statusPill(r.status)}</td></tr>`).join('')}</tbody></table></div>`;

function brainInsights(){
  const f=financial(),out=[];
  const worst=[...D.planning].sort((a,b)=>(a.actual-a.planned)-(b.actual-b.planned))[0];
  if(worst&&worst.actual<worst.planned)out.push({level:'critica',title:'Maior desvio de planejamento',text:`${worst.activity}: ${worst.actual}% realizado x ${worst.planned}% planejado (${(worst.actual-worst.planned).toFixed(1)} p.p.).`,action:'Priorizar remoção de restrições e plano de recuperação.'});
  if(f.projected<0)out.push({level:'critica',title:'Forecast acima do orçamento',text:`Projeção excede o orçamento atual em ${money(Math.abs(f.projected))}.`,action:'Revisar ETC, compromissos e escopo.'});
  else out.push({level:'ok',title:'Forecast dentro do orçamento',text:`Saldo projetado de ${moneyM(f.projected)}.`,action:'Manter revisão semanal do ETC.'});
  D.contracts.filter(contractApproved).forEach(c=>{const v=contractValue(c),saldo=v-measuredContract(c.id);if(v&&saldo/v<.2)out.push({level:'atencao',title:`Saldo contratual baixo — ${c.number}`,text:`Saldo ${moneyM(saldo)} (${pct(saldo/v*100)}).`,action:'Avaliar aditivo, saldo físico e escopo remanescente.'})});
  const overdue=D.restrictions.filter(r=>r.status!=='concluida'&&r.due<todayISO());if(overdue.length)out.push({level:'critica',title:'Restrições vencidas',text:`${overdue.length} restrição(ões) com prazo vencido.`,action:'Escalonar responsáveis e registrar nova data compromisso.'});
  const pendingPO=D.purchaseOrders.filter(p=>p.status==='em_aprovacao');if(pendingPO.length)out.push({level:'atencao',title:'Pedidos aguardando aprovação',text:`${pendingPO.length} pedido(s) somando ${moneyM(sum(pendingPO,p=>p.amount))}.`,action:'Aprovar ou devolver antes de comprometer a programação.'});
  const unread=D.alerts.filter(a=>!a.read);if(unread.length)out.push({level:'atencao',title:'Alertas não tratados',text:`${unread.length} alerta(s) ainda não lidos.`,action:'Revisar o painel de alertas.'});
  return out;
}
