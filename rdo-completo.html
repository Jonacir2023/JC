<title>Diário de Obras</title>
<style>
:root {
  --bg: #e8e4df;
  --bg-card: #f0ece7;
  --bg-dark: #2c2c2c;
  --bg-mid: #3d3935;
  --ink: #1c1a18;
  --ink-soft: #4a4540;
  --ink-faint: #8a8178;
  --accent: #d4541a;
  --accent-soft: #e8a030;
  --line: #ccc5bc;
  --green: #3a6b45;
  --red: #b83228;
  --blue: #2a4a72;
  --serif: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --sans: 'Barlow', -apple-system, sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  min-height: 100vh;
}

body {
  max-width: 480px;
  margin: 0 auto;
  padding-bottom: 80px;
}

.header {
  background: var(--bg-dark);
  color: #f0ece7;
  padding: 14px 16px 0;
  box-shadow: 0 3px 16px rgba(0,0,0,.4);
  border-bottom: 3px solid var(--accent);
  margin-bottom: 16px;
}

.header-title {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: 1px;
  color: #f0ece7;
  margin-bottom: 4px;
}

.header-subtitle {
  font-size: 12px;
  color: #aaa;
  margin-bottom: 12px;
}

.header-date {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent-soft);
  text-align: right;
  padding-bottom: 8px;
  border-top: 1px solid rgba(255,255,255,.1);
}

.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  background: var(--bg-dark);
  padding: 8px;
  margin: 0 16px 16px;
  border-radius: 8px;
}

.tab {
  padding: 10px 8px;
  border-radius: 6px;
  border: none;
  background: rgba(255,255,255,.08);
  color: #888;
  font-size: 11px;
  font-weight: 700;
  font-family: var(--serif);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: .5px;
  text-align: center;
  transition: all .2s;
}

.tab.active {
  background: var(--accent);
  color: #fff;
}

.content {
  padding: 0 16px;
}

.sec {
  background: var(--bg-card);
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 14px;
  border: 1px solid var(--line);
  box-shadow: 0 2px 12px rgba(0,0,0,.08);
}

.sec-title {
  font-family: var(--serif);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: .5px;
  color: var(--bg-dark);
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 10px 16px;
  border-radius: 8px;
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 700;
  letter-spacing: .5px;
  cursor: pointer;
  border: none;
  transition: all .18s;
  text-transform: uppercase;
}

.btn-primary {
  background: var(--accent);
  color: #fff;
}

.btn-primary:active {
  background: #b8431a;
}

.msg {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink-soft);
  font-size: 14px;
}

.msg-icon {
  font-size: 48px;
  margin-bottom: 16px;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-title">📝 RDO — Diário de Obras</div>
  <div class="header-subtitle">Relatório Diário de Atividades</div>
  <div class="header-date" id="rdo-date"></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="rdoTab('entrada')">📋 RDO</button>
  <button class="tab" onclick="rdoTab('relatorio')">📊 Relatórios</button>
  <button class="tab" onclick="rdoTab('resumo')">📈 Resumo</button>
  <button class="tab" onclick="rdoTab('config')">⚙️ Config</button>
</div>

<div class="content">
  <div class="sec" id="rdo-entrada">
    <div class="sec-title">📝 Nova Entrada RDO</div>
    <div class="msg">
      <div class="msg-icon">📋</div>
      <p>Diário de Obras — Compartilhado com Check-in e Pautas</p>
      <p style="font-size:12px;color:var(--ink-faint);margin-top:8px;">Sincronizado via Google Sheets</p>
    </div>
  </div>

  <div class="sec" id="rdo-relatorio" style="display:none;">
    <div class="sec-title">📊 Relatórios</div>
    <div class="msg">
      <p>Relatórios e análises do RDO</p>
    </div>
  </div>

  <div class="sec" id="rdo-resumo" style="display:none;">
    <div class="sec-title">📈 Resumo Geral</div>
    <div class="msg">
      <p>Resumo de atividades</p>
    </div>
  </div>

  <div class="sec" id="rdo-config" style="display:none;">
    <div class="sec-title">⚙️ Configurações</div>
    <div class="msg">
      <p>Configurar RDO e integrações</p>
    </div>
  </div>
</div>

<script>
function rdoTab(tab) {
  document.querySelectorAll('[id^="rdo-"]').forEach(el => el.style.display = 'none');
  document.getElementById('rdo-' + tab).style.display = 'block';
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
}

const now = new Date();
document.getElementById('rdo-date').textContent = now.toLocaleDateString('pt-BR', {weekday:'short',day:'2-digit',month:'short',year:'numeric'}) + ' ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit',minute:'2-digit'});

const rdoS = {
  get(k) { try { return JSON.parse(localStorage.getItem('rdo_' + k)); } catch { return null; } },
  set(k, v) { localStorage.setItem('rdo_' + k, JSON.stringify(v)); }
};

console.log('✓ RDO App carregado — Compartilhado com Check-in e Pautas');
</script>

</body>
</html>
