version: '3.8'

services:
  # ===== PostgreSQL (Event Store + State) =====
  postgres:
    image: postgres:15-alpine
    container_name: buildly-postgres
    ports:
      - "${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${PG_DATABASE:-buildly_db}
      POSTGRES_USER: ${PG_USER:-buildly_user}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-buildly_secure_password_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-buildly_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildly-network

  # ===== Neo4j (Graph Database) =====
  neo4j:
    image: neo4j:5.0-enterprise
    container_name: buildly-neo4j
    ports:
      - "7687:7687"
      - "7474:7474"
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-neo4j_password_2026}
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_dbms_security_procedures_unrestricted: "algo.*,apoc.*"
      NEO4J_dbms_memory_heap_max__size: "1024M"
    volumes:
      - neo4j_data:/var/lib/neo4j/data
      - neo4j_logs:/var/lib/neo4j/logs
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildly-network

  # ===== Redis (Cache + Sessions) =====
  redis:
    image: redis:7-alpine
    container_name: buildly-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildly-network

  # ===== Qdrant (Vector Database for RAG) =====
  qdrant:
    image: qdrant/qdrant:latest
    container_name: buildly-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT_API_KEY: qdrant_key_2026
    networks:
      - buildly-network

  # ===== Brain ML Engine (Python FastAPI) =====
  brain-ml:
    build:
      context: ./apps/ml-engine
      dockerfile: Dockerfile
    container_name: buildly-brain-ml
    ports:
      - "3002:3002"
    environment:
      PYTHONUNBUFFERED: 1
      PORT: 3002
      PG_HOST: postgres
      PG_DATABASE: ${PG_DATABASE:-buildly_db}
      PG_USER: ${PG_USER:-buildly_user}
      PG_PASSWORD: ${PG_PASSWORD:-buildly_secure_password_2026}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildly-network

  # ===== Core API (NestJS) =====
  core-api:
    build:
      context: ./apps/core-api
      dockerfile: Dockerfile
    container_name: buildly-core-api
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      API_PORT: 3001
      PG_HOST: postgres
      PG_PORT: ${PG_PORT:-5432}
      PG_DATABASE: ${PG_DATABASE:-buildly_db}
      PG_USER: ${PG_USER:-buildly_user}
      PG_PASSWORD: ${PG_PASSWORD:-buildly_secure_password_2026}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4j_password_2026}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_min_32_chars}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildly-network

  # ===== Decision Recorder API =====
  decision-api:
    build:
      context: ./apps/decision-api
      dockerfile: Dockerfile
    container_name: buildly-decision-api
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      PG_HOST: postgres
      PG_PORT: ${PG_PORT:-5432}
      PG_DATABASE: ${PG_DATABASE:-buildly_db}
      PG_USER: ${PG_USER:-buildly_user}
      PG_PASSWORD: ${PG_PASSWORD:-buildly_secure_password_2026}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildly-network

  # ===== NATS Message Bus =====
  nats:
    image: nats:2.9-alpine
    container_name: buildly-nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command:
      - "-js"
      - "-m 8222"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8222/varz"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - buildly-network

  # ===== Prometheus (Monitoring) =====
  prometheus:
    image: prom/prometheus:latest
    container_name: buildly-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - buildly-network

  # ===== Grafana (Visualization) =====
  grafana:
    image: grafana/grafana:latest
    container_name: buildly-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - buildly-network

volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  qdrant_data:
  prometheus_data:
  grafana_data:

networks:
  buildly-network:
    driver: bridge
